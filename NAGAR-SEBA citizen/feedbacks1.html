<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedbacks - Nagar Sheba</title>
  <link rel="stylesheet" href="feedbacks.css">
</head>
<body>

  <header>
    <h1>Nagar Sheba</h1>
    <hr>
  </header>

  <main>
    <h2>Feedbacks</h2>
    <p>Responses from officers about your reports appear here.</p>

    <div id="feedback-list">

      <p class="empty">No feedback received yet.</p>

      <!-- Each feedback will look like this:
      <section class="feedback">
        <h3>Road Problem</h3>
        <p class="meta">From: Officer Name | Date: 01-01-2026</p>
        <p class="message">Feedback message goes here.</p>
      </section>
      -->

    </div>

    <p>
      <a href="my-reports1.html">View My Reports</a> |
      <a href="dashboard1.html">Back to Dashboard</a>
    </p>
  </main>

  <footer>
    <hr>
    <p>&copy; Nagar Sheba</p>
  </footer>

  <script>
    (function () {
      'use strict';

      var FEEDBACK_KEY = 'nagarSheba_feedbacks';
      var MOBILE_BREAKPOINT = 600;

      var list = document.getElementById('feedback-list');
      var currentFilter = 'All';
      var toolbar = null;

      // ---------- Storage ----------
      // Expected format: [{ type, officer, date (ISO or text), message }]
      function getFeedbacks() {
        try {
          var data = JSON.parse(localStorage.getItem(FEEDBACK_KEY));
          return Array.isArray(data) ? data : [];
        } catch (e) {
          return [];
        }
      }

      function formatDate(value) {
        var d = new Date(value);
        if (isNaN(d.getTime())) return value || 'N/A';
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        return dd + '-' + mm + '-' + d.getFullYear();
      }

      // ---------- Build one feedback card (same markup as the comment in HTML) ----------
      function buildCard(item) {
        var section = document.createElement('section');
        section.className = 'feedback';

        var h3 = document.createElement('h3');
        h3.textContent = item.type || 'Report';

        var meta = document.createElement('p');
        meta.className = 'meta';
        meta.textContent = 'From: ' + (item.officer || 'Officer') + ' | Date: ' + formatDate(item.date);

        var msg = document.createElement('p');
        msg.className = 'message';
        msg.textContent = item.message || '';

        section.appendChild(h3);
        section.appendChild(meta);
        section.appendChild(msg);
        return section;
      }

      // ---------- Toolbar: count + filter by report type ----------
      function buildToolbar(items) {
        var types = ['All'];
        items.forEach(function (f) {
          if (f.type && types.indexOf(f.type) === -1) types.push(f.type);
        });

        var bar = document.createElement('div');
        bar.style.cssText =
          'display:flex;flex-wrap:wrap;gap:10px;align-items:center;' +
          'justify-content:space-between;margin-top:20px;text-align:left;';

        var count = document.createElement('span');
        count.id = 'feedback-count';
        count.style.cssText = 'font-size:14px;color:#555;';
        bar.appendChild(count);

        if (types.length > 2) {
          var select = document.createElement('select');
          select.setAttribute('aria-label', 'Filter by report type');
          select.style.cssText =
            'padding:8px 10px;border:1px solid #bbb;border-radius:5px;' +
            'font-size:14px;background:#fff;color:#333;max-width:100%;';
          types.forEach(function (t) {
            var opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t === 'All' ? 'All report types' : t;
            if (t === currentFilter) opt.selected = true;
            select.appendChild(opt);
          });
          select.addEventListener('change', function () {
            currentFilter = select.value;
            render();
          });
          bar.appendChild(select);
        }

        return bar;
      }

      // ---------- Render ----------
      function render() {
        var all = getFeedbacks();

        // Newest first
        all.sort(function (a, b) {
          return new Date(b.date).getTime() - new Date(a.date).getTime() || 0;
        });

        list.innerHTML = '';

        if (all.length === 0) {
          var empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No feedback received yet.';
          list.appendChild(empty);
          return;
        }

        // If the saved filter no longer exists, reset it
        var stillExists = all.some(function (f) { return f.type === currentFilter; });
        if (currentFilter !== 'All' && !stillExists) currentFilter = 'All';

        toolbar = buildToolbar(all);
        list.appendChild(toolbar);

        var shown = all.filter(function (f) {
          return currentFilter === 'All' || f.type === currentFilter;
        });

        shown.forEach(function (item) { list.appendChild(buildCard(item)); });

        document.getElementById('feedback-count').textContent =
          'Showing ' + shown.length + ' of ' + all.length + ' feedback' + (all.length === 1 ? '' : 's');

        adjustLayout();
      }

      // ---------- Responsive spacing ----------
      function adjustLayout() {
        var small = window.innerWidth <= MOBILE_BREAKPOINT;
        document.querySelectorAll('.feedback').forEach(function (card) {
          card.style.padding = small ? '15px' : '20px';
          card.style.marginTop = small ? '12px' : '20px';
        });
        if (toolbar) toolbar.style.justifyContent = small ? 'center' : 'space-between';
      }

      window.addEventListener('resize', adjustLayout);
      window.addEventListener('orientationchange', adjustLayout);

      // Update automatically if feedback is added in another tab
      window.addEventListener('storage', function (e) {
        if (e.key === FEEDBACK_KEY) render();
      });

      // Helper for testing from the browser console:
      // addFeedback({ type: 'Road Problem', officer: 'Officer Rahman', message: 'We will fix it soon.' })
      window.addFeedback = function (item) {
        var all = getFeedbacks();
        item.date = item.date || new Date().toISOString();
        all.push(item);
        try { localStorage.setItem(FEEDBACK_KEY, JSON.stringify(all)); } catch (e) { /* ignore */ }
        render();
      };

      // ---------- Init ----------
      render();
    })();
  </script>

</body>
</html>

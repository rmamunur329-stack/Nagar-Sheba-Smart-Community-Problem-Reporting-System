<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <h1>Nagar Sheba</h1>
    </header>

    <div>
        <h2 align="center">Login to Continue</h2>
    </div>

    <form align="center">

        <div>
            <label for="userType">User:</label>
            <select name="user" id="userType">
                <option value="User Type">User Type</option>
                <option value="Citizen">Citizen</option>
                <option value="Officer">Officer</option>
                <option value="Field Worker">Field Worker</option>
                <option value="Administrator">Administrator</option>
            </select>
        </div>
        <br>

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>
        <br>

        <div>
            <label for="nid">NID No.:</label>
            <input type="number" id="nid" name="nid">
        </div>
        <br>

        <div>
            <input type="submit" value="Login" class="btn">
        </div>

    </form>

    <script>
        (function () {
            'use strict';

            var MOBILE_BREAKPOINT = 600;
            var REDIRECT_URL = 'dashboard1.html';
            var SESSION_KEY = 'nagarSheba_session';
            var VALID_NID_LENGTHS = [10, 13, 17]; // Bangladesh NID formats

            var form = document.querySelector('form');
            var userType = document.getElementById('userType');
            var nameInput = document.getElementById('name');
            var nidInput = document.getElementById('nid');
            var submitBtn = form.querySelector('.btn');

            form.setAttribute('novalidate', 'novalidate');

            // Use a text field with a numeric keypad instead of type="number":
            // keeps leading zeros and blocks e, +, - and . characters
            nidInput.type = 'text';
            nidInput.setAttribute('inputmode', 'numeric');
            nidInput.setAttribute('autocomplete', 'off');
            nidInput.setAttribute('maxlength', '17');

            // ---------- Error message helpers ----------
            var fields = [userType, nameInput, nidInput];
            var errors = {};

            fields.forEach(function (field) {
                var err = document.createElement('div');
                err.setAttribute('role', 'alert');
                err.style.cssText = 'display:none;color:#b3261e;font-size:13px;margin-top:4px;';
                field.parentElement.appendChild(err);
                errors[field.id] = err;
            });

            function setError(field, message) {
                errors[field.id].textContent = message;
                errors[field.id].style.display = 'block';
                field.style.borderColor = '#b3261e';
                field.setAttribute('aria-invalid', 'true');
            }

            function clearError(field) {
                errors[field.id].style.display = 'none';
                field.style.borderColor = '';
                field.removeAttribute('aria-invalid');
            }

            // ---------- Validators ----------
            function validateUserType() {
                if (userType.value === 'User Type') {
                    setError(userType, 'Please select your user type.');
                    return false;
                }
                clearError(userType);
                return true;
            }

            function validateName() {
                var value = nameInput.value.trim();
                if (value.length < 2) {
                    setError(nameInput, 'Please enter your full name.');
                    return false;
                }
                if (!/^[A-Za-z\u0980-\u09FF .'-]+$/.test(value)) {
                    setError(nameInput, 'Name can only contain letters and spaces.');
                    return false;
                }
                clearError(nameInput);
                return true;
            }

            function validateNid() {
                var value = nidInput.value.trim();
                if (value === '') {
                    setError(nidInput, 'Please enter your NID number.');
                    return false;
                }
                if (VALID_NID_LENGTHS.indexOf(value.length) === -1) {
                    setError(nidInput, 'NID must be ' + VALID_NID_LENGTHS.join(', ') + ' digits.');
                    return false;
                }
                clearError(nidInput);
                return true;
            }

            // ---------- Events ----------
            userType.addEventListener('change', validateUserType);

            nameInput.addEventListener('blur', validateName);
            nameInput.addEventListener('input', function () {
                if (errors.name.style.display === 'block') validateName();
            });

            // Allow digits only
            nidInput.addEventListener('input', function () {
                nidInput.value = nidInput.value.replace(/\D/g, '');
                if (errors.nid.style.display === 'block') validateNid();
            });
            nidInput.addEventListener('blur', function () {
                if (nidInput.value !== '') validateNid();
            });

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var okType = validateUserType();
                var okName = validateName();
                var okNid = validateNid();

                if (!(okType && okName && okNid)) {
                    // Focus the first invalid field
                    var firstInvalid = form.querySelector('[aria-invalid="true"]');
                    if (firstInvalid) firstInvalid.focus();
                    return;
                }

                // Save a simple session (NID is intentionally not stored)
                try {
                    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                        userType: userType.value,
                        name: nameInput.value.trim(),
                        loggedInAt: new Date().toISOString()
                    }));
                } catch (err) { /* storage unavailable */ }

                submitBtn.disabled = true;
                submitBtn.value = 'Logging in...';
                submitBtn.style.opacity = '0.7';
                submitBtn.style.cursor = 'not-allowed';

                setTimeout(function () {
                    window.location.href = REDIRECT_URL;
                }, 600);
            });

            // ---------- Responsive layout ----------
            function adjustLayout() {
                var small = window.innerWidth <= MOBILE_BREAKPOINT;
                fields.forEach(function (field) {
                    var err = errors[field.id];
                    err.style.textAlign = small ? 'left' : 'center';
                });
                submitBtn.style.width = small ? '100%' : '';
            }

            window.addEventListener('resize', adjustLayout);
            window.addEventListener('orientationchange', adjustLayout);

            // ---------- Init ----------
            adjustLayout();
        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Report - Nagar Sheba</title>
 
  <link rel="stylesheet" href="create-report1.css">
</head>
<body>

  <header>
    <h1>Nagar Sheba</h1>
    <hr>
  </header>

  <main>
    <h2>Create Report</h2>
    <p>Choose the type of problem and describe it briefly.</p>

    <form action="dashboard1.html" method="get" id="reportForm" novalidate>

      <div class="form-box">

        <div class="left" id="leftCol">
          <h3>Type of Report</h3>

          <label class="option">
            <input type="radio" name="report_type" value="Road Problem" required>
            Road Problem
          </label>

          <label class="option">
            <input type="radio" name="report_type" value="Sewerage Problem">
            Sewerage Problem
          </label>

          <label class="option">
            <input type="radio" name="report_type" value="Water Problem">
            Water Problem
          </label>

          <label class="option">
            <input type="radio" name="report_type" value="Electricity Problem">
            Electricity Problem
          </label>

          <label class="option">
            <input type="radio" name="report_type" value="Waste Problem">
            Waste Problem
          </label>
        </div>

        <div class="right">
          <h3>Brief About the Report</h3>
          <textarea name="details" id="details" placeholder="Describe the problem here..." required></textarea>
        </div>

        <div class="submit-area">
          <button type="submit" id="submitBtn">Submit</button>
        </div>

      </div>

    </form>

    <p><a href="dashboard1.html">Back to Dashboard</a></p>
  </main>

  <footer>
    <hr>
    <p>&copy; Nagar Sheba</p>
  </footer>

  <script>
    (function () {
      'use strict';

      
      var MIN_CHARS = 10;
      var MAX_CHARS = 500;
      var MOBILE_BREAKPOINT = 600;
      var DRAFT_KEY = 'nagarSheba_reportDraft';

      var form = document.getElementById('reportForm');
      var textarea = document.getElementById('details');
      var submitBtn = document.getElementById('submitBtn');
      var leftCol = document.getElementById('leftCol');
      var options = document.querySelectorAll('.option');
      var radios = document.querySelectorAll('input[name="report_type"]');
      var submitArea = document.querySelector('.submit-area');

      textarea.setAttribute('maxlength', MAX_CHARS);

      
      var counter = document.createElement('div');
      counter.style.cssText = 'text-align:right;font-size:13px;color:#777;margin-top:4px;';
      textarea.insertAdjacentElement('afterend', counter);

      var errorBox = document.createElement('div');
      errorBox.setAttribute('role', 'alert');
      errorBox.style.cssText =
        'display:none;clear:both;background:#fdecec;color:#b3261e;border:1px solid #f2b8b5;' +
        'border-radius:6px;padding:10px;margin-top:15px;font-size:14px;text-align:center;';
      submitArea.insertAdjacentElement('beforebegin', errorBox);

      
      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function hideError() {
        errorBox.style.display = 'none';
      }

      function updateCounter() {
        var len = textarea.value.length;
        counter.textContent = len + ' / ' + MAX_CHARS;
        counter.style.color = len >= MAX_CHARS ? '#b3261e' : (len < MIN_CHARS ? '#777' : '#2e7d32');
      }

      
      function updateSelectedOption() {
        options.forEach(function (label) {
          var input = label.querySelector('input');
          if (input.checked) {
            label.style.backgroundColor = '#d6e4ff';
            label.style.borderColor = '#243a63';
            label.style.fontWeight = 'bold';
          } else {
            label.style.backgroundColor = '';
            label.style.borderColor = '';
            label.style.fontWeight = '';
          }
        });
      }

      function adjustLayout() {
        if (window.innerWidth > MOBILE_BREAKPOINT) {
          var h = leftCol.offsetHeight - 40; // minus heading area
          textarea.style.height = Math.max(h, 200) + 'px';
        } else {
          textarea.style.height = '200px';
        }
      }

      
      function saveDraft() {
        try {
          var checked = document.querySelector('input[name="report_type"]:checked');
          localStorage.setItem(DRAFT_KEY, JSON.stringify({
            type: checked ? checked.value : '',
            details: textarea.value
          }));
        } catch (e) { /* storage unavailable */ }
      }

      function loadDraft() {
        try {
          var raw = localStorage.getItem(DRAFT_KEY);
          if (!raw) return;
          var draft = JSON.parse(raw);
          textarea.value = draft.details || '';
          radios.forEach(function (r) { r.checked = (r.value === draft.type); });
        } catch (e) { /* ignore */ }
      }

      function clearDraft() {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
      }

      
      radios.forEach(function (r) {
        r.addEventListener('change', function () {
          updateSelectedOption();
          hideError();
          saveDraft();
        });
      });

      textarea.addEventListener('input', function () {
        updateCounter();
        hideError();
        saveDraft();
      });

      window.addEventListener('resize', adjustLayout);
      window.addEventListener('orientationchange', adjustLayout);

      form.addEventListener('submit', function (e) {
        var checked = document.querySelector('input[name="report_type"]:checked');
        var text = textarea.value.trim();

        if (!checked) {
          e.preventDefault();
          showError('Please choose a type of report.');
          leftCol.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        if (text.length < MIN_CHARS) {
          e.preventDefault();
          showError('Please describe the problem in at least ' + MIN_CHARS + ' characters.');
          textarea.focus();
          return;
        }

        
        textarea.value = text;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';
        submitBtn.style.opacity = '0.7';
        submitBtn.style.cursor = 'not-allowed';
        clearDraft();
      });

      
      loadDraft();
      updateSelectedOption();
      updateCounter();
      adjustLayout();
    })();
  </script>

</body>
</html>

  <script>
    (function () {
      'use strict';

      var MOBILE_BREAKPOINT = 600;
      var REDIRECT_URL = 'login.html';
      var USER_KEY = 'nagarSheba_registeredUser';
      var VALID_NID_LENGTHS = [10, 13, 17]; // Bangladesh NID formats

      var form = document.querySelector('form');
      var nameInput = document.getElementById('name');
      var nidInput = document.getElementById('nid');
      var division = document.getElementById('division');
      var district = document.getElementById('District');
      var upazila = document.getElementById('UT');
      var userType = document.getElementById('userType');
      var submitBtn = form.querySelector('.btn');

      form.setAttribute('novalidate', 'novalidate');

      // NID: text field with numeric keypad (keeps leading zeros, blocks e + - .)
      nidInput.type = 'text';
      nidInput.setAttribute('inputmode', 'numeric');
      nidInput.setAttribute('autocomplete', 'off');
      nidInput.setAttribute('maxlength', '17');

      // ---------- Cascading Division -> District -> Upazila/Thana ----------
      // The page already groups districts by "<Division> Division" and
      // upazilas by "<District> District", so those labels drive the filtering.
      function collectGroups(select) {
        var map = {};
        select.querySelectorAll('optgroup').forEach(function (group) {
          map[group.label] = Array.prototype.map.call(group.querySelectorAll('option'), function (o) {
            return o.textContent.trim();
          });
        });
        return map;
      }

      var districtGroups = collectGroups(district);
      var upazilaGroups = collectGroups(upazila);

      function resetSelect(select, placeholder, items, enable) {
        select.innerHTML = '';
        var first = document.createElement('option');
        first.value = '';
        first.textContent = placeholder;
        select.appendChild(first);

        (items || []).forEach(function (text) {
          var opt = document.createElement('option');
          opt.value = text;
          opt.textContent = text;
          select.appendChild(opt);
        });

        select.disabled = !enable;
        select.style.backgroundColor = enable ? '' : '#f1f3f7';
        select.style.cursor = enable ? '' : 'not-allowed';
      }

      resetSelect(district, '-- Select District --', [], false);
      resetSelect(upazila, '-- Select Upazila/Thana --', [], false);

      division.addEventListener('change', function () {
        var items = districtGroups[division.value + ' Division'] || [];
        resetSelect(district, '-- Select District --', items, items.length > 0);
        resetSelect(upazila, '-- Select Upazila/Thana --', [], false);
        validateSelect(division, 'Please select your division.');
      });

      district.addEventListener('change', function () {
        var items = upazilaGroups[district.value + ' District'] || [];
        resetSelect(upazila, '-- Select Upazila/Thana --', items, items.length > 0);
        validateSelect(district, 'Please select your district.');
      });

      // ---------- Error message helpers ----------
      var fields = [nameInput, nidInput, division, district, upazila, userType];
      var errors = {};

      fields.forEach(function (field) {
        var err = document.createElement('div');
        err.setAttribute('role', 'alert');
        err.style.cssText = 'display:none;color:#b3261e;font-size:13px;margin-top:4px;';
        field.insertAdjacentElement('afterend', err);
        errors[field.id] = err;
      });

      function setError(field, message) {
        errors[field.id].textContent = message;
        errors[field.id].style.display = 'block';
        field.style.borderColor = '#b3261e';
        field.setAttribute('aria-invalid', 'true');
      }

      function clearError(field) {
        errors[field.id].style.display = 'none';
        field.style.borderColor = '';
        field.removeAttribute('aria-invalid');
      }

      // ---------- Validators ----------
      function validateName() {
        var value = nameInput.value.trim();
        if (value.length < 2) {
          setError(nameInput, 'Please enter your full name.');
          return false;
        }
        if (!/^[A-Za-z\u0980-\u09FF .'-]+$/.test(value)) {
          setError(nameInput, 'Name can only contain letters and spaces.');
          return false;
        }
        clearError(nameInput);
        return true;
      }

      function validateNid() {
        var value = nidInput.value.trim();
        if (value === '') {
          setError(nidInput, 'Please enter your NID number.');
          return false;
        }
        if (VALID_NID_LENGTHS.indexOf(value.length) === -1) {
          setError(nidInput, 'NID must be ' + VALID_NID_LENGTHS.join(', ') + ' digits.');
          return false;
        }
        clearError(nidInput);
        return true;
      }

      function validateSelect(select, message) {
        if (!select.value || select.value === 'Select User') {
          setError(select, message);
          return false;
        }
        clearError(select);
        return true;
      }

      // ---------- Events ----------
      nameInput.addEventListener('blur', validateName);
      nameInput.addEventListener('input', function () {
        if (errors.name.style.display === 'block') validateName();
      });

      nidInput.addEventListener('input', function () {
        nidInput.value = nidInput.value.replace(/\D/g, '');
        if (errors.nid.style.display === 'block') validateNid();
      });
      nidInput.addEventListener('blur', function () {
        if (nidInput.value !== '') validateNid();
      });

      upazila.addEventListener('change', function () {
        validateSelect(upazila, 'Please select your upazila/thana.');
      });
      userType.addEventListener('change', function () {
        validateSelect(userType, 'Please select your user type.');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var results = [
          validateName(),
          validateNid(),
          validateSelect(division, 'Please select your division.'),
          validateSelect(district, 'Please select your district.'),
          validateSelect(upazila, 'Please select your upazila/thana.'),
          validateSelect(userType, 'Please select your user type.')
        ];

        if (results.indexOf(false) !== -1) {
          var firstInvalid = form.querySelector('[aria-invalid="true"]');
          if (firstInvalid) firstInvalid.focus();
          return;
        }

        // Save registration details (NID is intentionally not stored)
        try {
          localStorage.setItem(USER_KEY, JSON.stringify({
            name: nameInput.value.trim(),
            division: division.value,
            district: district.value,
            upazila: upazila.value,
            userType: userType.value,
            registeredAt: new Date().toISOString()
          }));
        } catch (err) { /* storage unavailable */ }

        submitBtn.disabled = true;
        submitBtn.value = 'Registering...';
        submitBtn.style.opacity = '0.7';
        submitBtn.style.cursor = 'not-allowed';

        setTimeout(function () {
          window.location.href = REDIRECT_URL;
        }, 600);
      });

      // ---------- Responsive layout ----------
      function adjustLayout() {
        var small = window.innerWidth <= MOBILE_BREAKPOINT;
        fields.forEach(function (field) {
          errors[field.id].style.textAlign = small ? 'left' : 'center';
        });
        submitBtn.style.width = small ? '100%' : '';
      }

      window.addEventListener('resize', adjustLayout);
      window.addEventListener('orientationchange', adjustLayout);

      // ---------- Init ----------
      adjustLayout();
    })();
  </script>

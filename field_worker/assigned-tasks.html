<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Assigned Tasks - Nagar Sheba</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="loadAssignedTasks()">
  <header><h1>Nagar Sheba - Field Worker</h1></header>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="assigned-tasks.html">Assigned Tasks</a>
    <a href="task-history.html">Task History</a>
    <a href="../auth/login.html">Logout</a>
  </nav>
  <div class="container">
    <h2>Assigned Tasks</h2>
    <div class="box">
      <label for="statusFilter">Filter by status</label>
      <select id="statusFilter" onchange="loadAssignedTasks()">
        <option value="All">All</option>
        <option value="Assigned">Assigned</option>
        <option value="Accepted">Accepted</option>
        <option value="In Progress">In Progress</option>
      </select>
      <br><br>
      <table>
        <tr><th>ID</th><th>Title</th><th>Location</th><th>Priority</th><th>Deadline</th><th>Status</th><th>Action</th></tr>
        <tbody id="taskRows"></tbody>
      </table>
    </div>
  </div>
  <footer>Nagar Sheba - Smart Community Problem Reporting System</footer>
  <script src="script.js"></script>
</body>
</html>

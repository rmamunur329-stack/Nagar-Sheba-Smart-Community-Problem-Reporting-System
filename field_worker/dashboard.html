<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Nagar Sheba</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="loadDashboard()">
  <header><h1>Nagar Sheba - Field Worker</h1></header>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="assigned-tasks.html">Assigned Tasks</a>
    <a href="task-history.html">Task History</a>
    <a href="../auth/login.html">Logout</a>
  </nav>
  <div class="container">
    <h2>Welcome, Field Worker</h2>
    <div class="card-row">
      <div class="card"><h3 id="countAssigned">0</h3><p>New / Accepted</p></div>
      <div class="card"><h3 id="countProgress">0</h3><p>In Progress</p></div>
      <div class="card"><h3 id="countDone">0</h3><p>Completed</p></div>
      <div class="card"><h3 id="countOverdue" class="red">0</h3><p>Overdue</p></div>
    </div>
    <div class="box">
      <h2>My Active Tasks</h2>
      <table>
        <tr><th>ID</th><th>Title</th><th>Location</th><th>Priority</th><th>Deadline</th><th>Status</th><th>Action</th></tr>
        <tbody id="recentRows"></tbody>
      </table>
    </div>
  </div>
  <footer>Nagar Sheba - Smart Community Problem Reporting System</footer>
  <script src="script.js"></script>
</body>
</html>

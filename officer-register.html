<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Officer Registration - Nagar Sheba</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

  <div class="header">
    <h1>Nagar Sheba</h1>
    <h3>Smart Community Problem Reporting System</h3>
  </div>

  <div class="container">
    <h2>Officer Registration</h2>
    <p>Fill in the form below to create your department officer account.</p>

    <form action="" onsubmit="return validateRegister()" novalidate>

      <table class="form-table">

        <tr>
          <td><label for="fullname">Full Name:</label></td>
          <td><input type="text" id="fullname" name="fullname" size="30" placeholder="Enter your full name" required></td>
        </tr>

        <tr>
          <td><label for="officerid">Officer ID:</label></td>
          <td><input type="text" id="officerid" name="officerid" size="30" placeholder="Enter your officer ID" required></td>
        </tr>

        <tr>
          <td><label for="email">Official Email:</label></td>
          <td><input type="email" id="email" name="email" size="30" placeholder="Enter your email" required></td>
        </tr>

        <tr>
          <td><label for="phone">Phone:</label></td>
          <td><input type="text" id="phone" name="phone" size="30" placeholder="01XXXXXXXXX" required></td>
        </tr>

        <tr>
          <td><label for="dob">Date of Birth:</label></td>
          <td><input type="date" id="dob" name="dob"></td>
        </tr>

        <tr>
          <td><label for="gender">Gender:</label></td>
          <td>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
          </td>
        </tr>

        <tr>
          <td><label for="department">Department:</label></td>
          <td>
            <select id="department" name="department" required>
              <option value=""> Select Department </option>
              <option value="roads">Roads and Highways</option>
              <option value="water">Water Supply</option>
              <option value="electricity">Electricity</option>
              <option value="waste">Waste Management</option>
              <option value="drainage">Drainage and Sewerage</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="designation">Designation:</label></td>
          <td>
            <select id="designation" name="designation">
              <option value="assistant">Assistant Officer</option>
              <option value="senior">Senior Officer</option>
              <option value="chief">Chief Officer</option>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="address">Office Address:</label></td>
          <td><textarea id="address" name="address" rows="4" cols="29"></textarea></td>
        </tr>

        <tr>
          <td><label for="password">Password:</label></td>
          <td><input type="password" id="password" name="password" size="30" placeholder="Enter your password" required></td>
        </tr>

        <tr>
          <td><label for="confirm">Confirm Password:</label></td>
          <td><input type="password" id="confirm" name="confirm" size="30" placeholder="Enter password again" required></td>
        </tr>

        <tr>
          <td><label for="idcard">Office ID Card:</label></td>
          <td><input type="file" id="idcard" name="idcard"></td>
        </tr>

        <tr>
          <td colspan="2" class="full">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I confirm that the information is correct and I agree to the terms</label>
          </td>
        </tr>

        <tr>
          <td colspan="2" class="full buttons">
            <input type="submit" id="submitBtn" value="Register" class="btn">
            <input type="reset" value="Clear" class="btn btn-red">
          </td>
        </tr>

      </table>

    </form>

    <p id="message"></p>

    <br>
    <p>
      Already have an account?
      <a href="">Officer Login</a>
    </p>

    <p>
      Not an officer?
      <a href="">Citizen Registration</a>
    </p>

    <p><a href="">Back to Home</a></p>
  </div>

  <div class="footer">
    <p>&copy; 2026 Nagar Sheba. All rights reserved.</p>
  </div>

  <script src="validation.js"></script>

</body>
</html>
